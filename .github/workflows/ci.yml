name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Generated manifests match plugin.json and mcp.json; every skill meets the Agent Skills spec.
      - run: npm run check
      - run: npx --yes @anthropic-ai/claude-code plugin validate --strict .
